<!DOCTYPE html>
<html>
<head>
    <title>Spice Garden Assistant</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: Arial; 
        background: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
    }
    
    .container {
        width: 100%;
        max-width: 600px;
        height: 90vh;
        max-height: 700px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
    }
    
    .header {
        background: #ff6b35;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        flex-shrink: 0;
    }
    
    .chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .message {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 80%;
        font-size: 15px;
        line-height: 1.4;
        word-wrap: break-word;
    }
    
    .bot {
        background: #f0f0f0;
        color: black;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    
    .user {
        background: #ff6b35;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    
    .input-area {
        display: flex;
        padding: 15px;
        border-top: 1px solid #eee;
        gap: 10px;
        flex-shrink: 0;
    }
    
    input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 25px;
        outline: none;
        font-size: 15px;
    }
    
    button {
        padding: 12px 20px;
        background: #ff6b35;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
    }

    button:active {
        background: #e55a25;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">🍽️ Spice Garden Assistant</div>
        <div class="chatbox" id="chatbox">
            <div class="message bot">
                Hi! Welcome to Spice Garden. 
                How can I help you today?
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" 
                placeholder="Type your message..." 
                onkeypress="handleKey(event)"/>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: message})
            });

            const data = await response.json();
            addMessage(data.response, 'bot');
        }

        function addMessage(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
