<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Garden Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #16213e;
        }

        .header {
            padding: 20px;
            background: #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1a4a7a;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info h2 {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .header-info p {
            color: #4ade80;
            font-size: 12px;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
        }

        .chatbox::-webkit-scrollbar { display: none; }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 72%;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.bot {
            background: #0f3460;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: #e94560;
            color: white;
            border-bottom-right-radius: 4px;
            min-width: 48px;
            text-align: center;
}

        .time {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            padding: 0 4px;
        }

        .time.user { text-align: right; }

        .typing {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
        }

        .typing.active { display: flex; }

        .typing-bubble {
            background: #0f3460;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            padding: 16px;
            background: #0f3460;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #1a4a7a;
        }

        input {
            flex: 1;
            padding: 12px 18px;
            background: #16213e;
            border: 1px solid #1a4a7a;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input::placeholder { color: #64748b; }

        input:focus {
            border-color: #e94560;
        }

        button {
            width: 44px;
            height: 44px;
            background: #e94560;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        @media (min-width: 480px) {
            body { background: #1a1a2e; }
            .container {
                height: 85vh;
                max-height: 750px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">🍽️</div>
            <div class="header-info">
                <h2>Spice Garden Assistant</h2>
                <p><span class="status-dot"></span>Online • Always here to help</p>
            </div>
        </div>

        <div class="chatbox" id="chatbox">
            <div class="message-row">
                <div class="msg-avatar">🤖</div>
                <div>
                    <div class="message bot">
                        Namaste! 🙏 Welcome to Spice Garden. How can I help you today?
                    </div>
                    <div class="time">Just now</div>
                </div>
            </div>
        </div>

        <div class="typing" id="typing">
            <div class="msg-avatar">🤖</div>
            <div class="typing-bubble">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput"
                placeholder="Type a message..."
                onkeypress="handleKey(event)"/>
            <button onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        function getTime() {
            return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            document.getElementById('typing').classList.add('active');
            scrollBottom();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message})
                });
                const data = await response.json();
                document.getElementById('typing').classList.remove('active');
                addMessage(data.response, 'bot');
            } catch (error) {
                document.getElementById('typing').classList.remove('active');
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
            }
        }

        function addMessage(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            if (sender === 'bot') {
                row.innerHTML = `
                    <div class="msg-avatar">🤖</div>
                    <div>
                        <div class="message bot">${text}</div>
                        <div class="time">${getTime()}</div>
                    </div>`;
            } else {
                row.innerHTML = `
                    <div>
                        <div class="message user">${text}</div>
                        <div class="time user">${getTime()}</div>
                    </div>`;
            }

            chatbox.appendChild(row);
            scrollBottom();
        }

        function scrollBottom() {
            const chatbox = document.getElementById('chatbox');
            setTimeout(() => chatbox.scrollTop = chatbox.scrollHeight, 100);
        }

        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
